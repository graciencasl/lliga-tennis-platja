<head>

<title>Lliga Catalana de Tennis Platja</title>

<style>
/* Paleta: vermell, blanc i negre (línia FCT). Tot el color surt d'aquestes variables.
   Només el vermell fa d'accent; l'èxit/avís s'indiquen amb text i grisos, no amb altres colors. */
:root{
  --bg:#eee6d6; --surface:#ffffff; --soft:#f2f2f2; --ink:#111111; --muted:#555555; --line:#b8b8b8; --line-soft:#dcdcdc; --shadow:0 1px 3px rgba(0,0,0,.12);
  --accent:#c8102e; --accent-ink:#ffffff; --ball:#111111;
  --hdr:#111111; --hdr-ink:#ffffff;
  --warn:#111111; --warn-bg:#f1f1f1; --ok:#111111; --ok-bg:#e6e6e6; --bad:#a30d1f; --bad-bg:#fde8ea;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050505; --surface:#181818; --soft:#242424; --ink:#ffffff; --muted:#b5b5b5; --line:#4a4a4a; --line-soft:#2e2e2e; --shadow:0 1px 3px rgba(0,0,0,.6);
  --accent:#ff4b55; --accent-ink:#111111; --ball:#ffffff;
  --hdr:#000000; --hdr-ink:#ffffff;
  --warn:#ffffff; --warn-bg:#222222; --ok:#ffffff; --ok-bg:#2b2b2b; --bad:#ff8088; --bad-bg:#3b1519; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#050505; --surface:#181818; --soft:#242424; --ink:#ffffff; --muted:#b5b5b5; --line:#4a4a4a; --line-soft:#2e2e2e; --shadow:0 1px 3px rgba(0,0,0,.6);
  --accent:#ff4b55; --accent-ink:#111111; --ball:#ffffff;
  --hdr:#000000; --hdr-ink:#ffffff;
  --warn:#ffffff; --warn-bg:#222222; --ok:#ffffff; --ok-bg:#2b2b2b; --bad:#ff8088; --bad-bg:#3b1519; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
header{background:var(--hdr);color:var(--hdr-ink);border-bottom:4px solid var(--accent);padding:20px max(16px,calc((100% - 860px)/2 + 16px)) 14px;margin:0 0 4px}
h1{font:700 1.9rem/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance;text-transform:uppercase}
h2{font:700 1.5rem/1.1 var(--display);text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
.sub{color:#d0d0d0;margin:4px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
[hidden]{display:none!important}
.pill{display:inline-block;white-space:nowrap;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.pill.warn{background:var(--ink);color:var(--bg)}
.chipst{display:inline-block;white-space:nowrap;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px}
.chipst.ok{background:var(--ok-bg);color:var(--ok)}
.chipst.pend{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chipst.bad{background:var(--bad-bg);color:var(--bad)}
main{max-width:860px;margin:0 auto;padding:0 16px 48px}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:12px 0 14px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-decoration:none;padding:12px 10px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;flex:0 0 auto}
@media (max-width:420px){nav.tabs a{font-size:.95rem;padding:12px 8px;letter-spacing:.01em}}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.divs{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-bottom:16px}
.divs .lbl{font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 .95rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;min-width:48px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.jornada{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.jhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;background:var(--soft);border-bottom:2px solid var(--line);flex-wrap:wrap}
.jhead h3{font:700 1.25rem var(--display);text-transform:uppercase;margin:0}
.jhead .when{color:var(--muted);font-size:.92rem}
.jornada.next{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.tag{font-size:.75rem;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
a.match{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;padding:10px 14px;align-items:center;color:inherit;text-decoration:none}
a.match:nth-of-type(even){background:var(--soft)}
a.match:hover{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.match + .match{border-top:1px solid var(--line-soft)}
.team{font-weight:600}
.team.away{text-align:right}
.team.win{color:var(--accent)}
.team small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.vs{font:700 .9rem var(--display);color:var(--muted);text-align:center;min-width:44px}
.score{font:700 1.35rem var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.meta{grid-column:1/-1;font-size:.82rem;color:var(--muted);display:flex;gap:2px 14px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.card summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card summary::-webkit-details-marker{display:none}
.card summary .nm{font-weight:700}
.card summary .info{font-size:.85rem;color:var(--muted)}
.card summary > .info{white-space:nowrap}
.card .body{padding:12px 14px}
details.card .body{padding-top:12px}
details.card[open] > summary{background:var(--soft);border-bottom:2px solid var(--line)}
details.card:nth-of-type(even){background:var(--soft)}
details.card:nth-of-type(even)[open] > summary{background:var(--surface)}
details.card:nth-of-type(even) tbody tr:nth-child(even) td{background:var(--surface)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--soft)}
th{font-size:.75rem;text-transform:uppercase;color:var(--ink);background:var(--soft);border-bottom:2px solid var(--line);letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.pts{font-weight:700}
td.eq{white-space:normal;min-width:140px}
@media (max-width:420px){.tablewrap th,.tablewrap td{padding:7px 3px}.tablewrap td.eq{min-width:0}.card .body.tablewrap{padding-left:8px;padding-right:8px}.card tbody tr.fila .teamlink{padding:6px 0}}
td.eq small{display:block;color:var(--muted);font-size:.75rem}
.warnlist,.errlist{border-left:4px solid var(--ink);background:var(--warn-bg);padding:8px 12px;border-radius:6px;margin:8px 0 10px;font-size:.88rem}
.errlist{border-color:var(--bad);background:var(--bad-bg)}
.warnlist ul,.errlist ul{margin:4px 0 0;padding-left:18px}
.oklist{border-left:4px dashed var(--muted);background:var(--ok-bg);padding:8px 12px;border-radius:6px;margin:8px 0 10px;font-size:.88rem}
.state{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.note{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);font-weight:600;text-decoration:none}
.btn{font:700 .95rem var(--body);border-radius:8px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.sec{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
label{font-size:.85rem;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:100%}
.field{margin-bottom:12px}
.torn{border-top:2px solid var(--line);padding-top:10px;margin-top:14px}
.torn h3{font:700 1.15rem var(--display);text-transform:uppercase;margin:0 0 6px}
.partit{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--soft)}
.partit .ph{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}
.sides{display:grid;grid-template-columns:1fr;gap:8px}
.side select{width:100%;margin-bottom:4px}
.sets{display:grid;grid-template-columns:auto repeat(3,64px);gap:4px 8px;align-items:center;margin-top:8px}
.sets input{width:64px;text-align:center}
.sets .h{font-size:.75rem;color:var(--muted);text-align:center;text-transform:uppercase}
.result{font:700 1.6rem var(--display);text-align:center;margin:8px 0}
.ro-partit{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:.9rem;align-items:center}
.ro-partit .s{font-variant-numeric:tabular-nums;font-weight:700;text-align:center;white-space:nowrap}
.ro-partit .r{text-align:right}
.ro-partit .w{font-weight:700;color:var(--accent)}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px}
.teamlink{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;text-decoration:none}
.card tbody tr.fila{cursor:pointer}
.card tbody tr.fila .teamlink{padding:10px 0}
.card tbody tr.fila.fila:hover td,.card tbody tr.fila.fila:focus-within td,.card tbody tr.fila.fila.sel td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.card tbody tr.fila.fila.sel td:first-child,.card tbody tr.fila.fila.meu td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.card tbody tr.fila.fila.meu td,.card tbody tr.fila.fila.meu:hover td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.filtre{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.filtre label{font-weight:600;font-size:.9rem;white-space:nowrap}
.filtre select{flex:1;min-width:0;min-height:44px}
.filtre .btn{min-height:44px}
.caps,.cerca{list-style:none;margin:8px 0;padding:0}
.caps li,.cerca li{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0}
.cerca li{justify-content:flex-start}
.caps .btn,.cerca .btn{min-height:44px}
.divtit{font:700 1.1rem var(--display);text-transform:uppercase;margin:16px 0 8px}
.filtre-club{margin:-4px 0 12px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(600px,calc(100% - 20px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dhead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 10px;background:var(--hdr);color:var(--hdr-ink);border-bottom:4px solid var(--accent)}
.dhead h2{margin:0;color:var(--hdr-ink)}
.dhead p{margin:2px 0 0;font-size:.88rem;color:#d0d0d0}
.dclose{flex:none;font:700 1rem var(--body);background:transparent;color:var(--hdr-ink);border:1px solid #888;border-radius:8px;padding:6px 12px;cursor:pointer}
.dclose:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dbody{padding:14px 16px 18px}
.dbody h3{font:700 1.15rem var(--display);text-transform:uppercase;margin:18px 0 8px}
.dbody h3:first-child{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 1.35rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.jrow{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.jrow:nth-child(even){background:var(--soft);margin:0 -16px;padding:10px 16px}
.jrow .l1 > span:last-child{white-space:nowrap}
.jrow .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.jrow .rv{font-weight:600}
.jrow .sc{font:700 1.2rem var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.jrow .l2{font-size:.82rem;color:var(--muted);display:flex;gap:2px 12px;flex-wrap:wrap;margin-top:2px;align-items:center}
.jrow.pend{color:var(--muted)}
.jrow a{color:var(--accent);font-weight:600}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.step p{margin:0 0 8px;font-size:.9rem}
.step table th.crit,.step table td.crit{background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:700}
.step tr.me td{font-weight:700}
.step th,.step td{padding:6px 4px}
.step td.eq{min-width:0;white-space:normal}
.step .res{margin:8px 0 0;font-weight:600}
@media (min-width:640px){h1{font-size:2.4rem}.sides{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const ERR_LECTURA={not_granted:"No has permès que aquesta pàgina faci servir Claude.",sampling_disabled:"Claude no està disponible per al teu compte.",rate_limited:"Massa peticions o límit d'ús assolit. Prova-ho més tard.",

function promptLectura(f){
  const R=rosters(f), llista=c=>R[c].map(j=>`${j.ordre}. ${j.nom} ${j.cognoms}`).join("\n");
  return `Aquesta imatge és l'acta d'una eliminatòria de la Lliga Catalana de Tennis Platja (equips de 3 o 4 jugadors, 6 partits de dobles en 3 torns de 2 partits).
Equip A = LOCAL = ${nomEq(f.local)}. Equip B = VISITANT = ${nomEq(f.visitant)}.
Llista de jugadors del local (ordre. nom):
${llista("L")}
Llista de jugadors del visitant (ordre. nom):
${llista("V")}

Llegeix l'acta i respon NOMÉS amb un JSON d'aquesta forma:
{"dataJoc":"AAAA-MM-DD","partits":[{"estat":"jugat","L":[ordre,ordre],"V":[ordre,ordre],"sets":[[jocsLocal,jocsVisitant],[jocsLocal,jocsVisitant],[puntsLocal,puntsVisitant]]}, ... 6 partits en l'ordre de l'acta ...],"dubtes":["text curt"]}
Regles:
- "L" i "V" són els números d'ordre (de les llistes d'amunt) dels dos jugadors de cada parella; identifica'ls pel nom. Si un nom no coincideix amb la llista o no es llegeix, posa null.
- "sets": el set 1, el set 2 i, només si van 1-1, el match tie-break (punts, no jocs). Sempre [local, visitant]. Si hi ha només 2 sets, posa només 2 parelles.
- "estat": "jugat"; "retirada_L" o "retirada_V" si es retira la parella local o visitant; "wo_L" o "wo_V" si la parella local o visitant no es presenta o no es disputa (en aquest cas sense sets).
- La data en format AAAA-MM-DD (temporada 2026-27: els anys possibles són 2026 i 2027).
- No t'inventis res. Si una xifra, un nom o la data no es llegeixen amb seguretat, deixa-ho null o buit i afegeix una frase a "dubtes" que digui el partit i què falta. Afegeix també a "dubtes" qualsevol cosa estranya (esmenes, ratllades, resultats que no quadren).`;
}
async function llegeixActa(f,d,info,btn){

    const raw=await S.sample.json(promptLectura(f),{images:[d.fitxer],modelTier:"complex",cache:false});
    const r=E.sanejaLectura(raw,rosters(f));
    if(r.dataJoc)d.dataJoc=r.dataJoc;

    S.llegint=false; btn.disabled=false;

  if(d.mode==="correccio")acts.append(el("button",{class:"btn",type:"button",id:"b-desa",text:"Desar la correcció",onclick:()=>desar(f,"correccio")}));
  else{
    acts.append(el("button",{class:"btn",type:"button",id:"b-desa",text:S.admin?"Enviar (queda pendent)":"Enviar l'acta",onclick:()=>desar(f,"enviament")}));
    if(S.admin)acts.append(el("button",{class:"btn",type:"button",id:"b-valida",text:"Desar i validar",onclick:()=>desar(f,"valida")}));
  }
  acts.append(el("button",{class:"btn sec",type:"button",text:"Cancel·lar",onclick:()=>{S.draft=null;S.editing=false;S.flash=null;render()}}));
  form.append(acts);
  box.append(form);
  actualitzaResum();
}
function actualitzaResum(){
  const d=S.draft, box=$("#resum"); if(!d||!box)return;
  const f=elim(d.eliminatoria); const a=normalitza(d);
  const chk=E.validarActa(a,rosters(f));
  box.replaceChildren();
  // resultat només amb partits que tenen guanyador clar
  let ok=true; try{a.partits.forEach(p=>{if(!p.estat.startsWith("wo_")&&(p.sets||[]).some(s=>!Number.isFinite(s[0])||!Number.isFinite(s[1])))ok=false})}catch(e){ok=false}
  if(ok){const r=E.resultatEliminatoria(a);box.append(el("div",{class:"result",text:`${nomEq(f.local)} ${r.partitsL} - ${r.partitsV} ${nomEq(f.visitant)}`}),
    el("p",{class:"note",style:"text-align:center",text:r.guanya?`Guanya ${nomEq(r.guanya==="L"?f.local:f.visitant)}`:"Empat"}))}
  if(chk.errors.length)box.append(el("div",{class:"errlist"},el("strong",{text:`Cal corregir (${chk.errors.length})`}),el("ul",{},...chk.errors.map(e=>el("li",{text:e})))));
  if(chk.avisos.length)box.append(el("div",{class:"warnlist"},el("strong",{text:"Avisos"}),el("ul",{},...chk.avisos.map(e=>el("li",{text:e})))));
  if(!chk.errors.length)box.append(el("div",{class:"oklist",text:"L'acta és completa i els resultats són vàlids."}));
  ["b-desa","b-valida"].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=chk.errors.length>0||S.busy});
}

/* ---------- escriptures ---------- */
async function guardar(fn,okText){
  S.busy=true;
  try{await fn();if(okText)S.flash={ok:true,text:okText};return true}
  catch(e){
    const msg=e&&e.code==="invalid_argument"?"No tens permís per fer aquesta acció.":e&&e.code==="quota_exceeded"?"La base de dades és plena. Avisa l'administrador.":"No s'ha pogut desar. Torna-ho a provar.";
    S.flash={ok:false,text:msg};return false}
  finally{S.busy=false}
}
async function desar(f,mode){
  if(mode!=="correccio"&&!potEnviar(f)){S.flash={ok:false,text:"Només el capità de l'equip local pot enviar aquesta acta."};render();return}
  const a=normalitza(S.draft);
  const chk=E.validarActa(a,rosters(f)); if(chk.errors.length)return;
  const ara=new Date().toISOString();
  let ok;
  if(mode==="correccio"){
    const prev=S.validades[f.id]||{};
    ok=await guardar(()=>S.db.doc("validades/"+f.id).set({...a,validadaAt:prev.validadaAt||ara,validadaPer:prev.validadaPer||S.uid,corregidaAt:ara,corregidaPer:S.uid}),"Correcció desada. La classificació s'ha recalculat.");
  }else{
    const doc={...a,estat:"pendent",enviadaAt:ara,enviadaPer:S.uid,motiu:null};
    ok=await guardar(()=>S.db.doc("actes/"+f.id).set(doc),mode==="valida"?null:"Acta enviada. Queda pendent de validar per l'administrador.");
    if(ok&&mode==="valida")ok=await validar(f,doc,true);
  }
  if(ok){S.draft=null;S.editing=false}
  render();
}
async function validar(f,a,silenci){
  const ara=new Date().toISOString();
  const {estat,enviadaAt,enviadaPer,motiu,...net}=a;
  const ok=await guardar(()=>S.db.doc("validades/"+f.id).set({...net,validadaAt:ara,validadaPer:S.uid,enviadaAt:enviadaAt||null}),"Acta validada. La classificació s'ha recalculat.");
  if(ok)await guardar(()=>S.db.doc("actes/"+f.id).update({estat:"validada",validadaAt:ara}),null);
  if(!silenci)render();
  return ok;
}
function retornar(box,f){
  const t=el("textarea",{id:"motiu",rows:"3",style:"width:100%"});
  const panel=el("div",{class:"card"},el("div",{class:"body"},el("label",{for:"motiu",text:"Motiu (el veurà qui ha enviat l'acta)"}),t,
    el("div",{class:"actions"},el("button",{class:"btn danger",type:"button",text:"Retornar l'acta",onclick:async()=>{
      if(!t.value.trim()){t.focus();return}
      await guardar(()=>S.db.doc("actes/"+f.id).update({estat:"rebutjada",motiu:t.value.trim()}),"Acta retornada a l'equip.");render()}}),
      el("button",{class:"btn sec",type:"button",text:"Cancel·lar",onclick:()=>panel.remove()}))));
  box.append(panel); t.focus();
}
function renderWO(box,f){
  const qui=el("select",{id:"wo-qui"},el("option",{value:"L",text:`${nomEq(f.local)} (local)`}),el("option",{value:"V",text:`${nomEq(f.visitant)} (visitant)`}));
  const motiu=el("select",{id:"wo-motiu"},el("option",{value:"incompareixenca",text:"No es va presentar a l'eliminatòria"}),el("option",{value:"fora_termini",text:"Més de 15 dies sense jugar (no va tenir disponibilitat)"}));
  if(foraTermini(f))motiu.value="fora_termini";
  const panel=el("div",{class:"card"},el("div",{class:"body"},
    el("p",{class:"note",text:"L'equip no presentat suma −1 punt; el rival en suma 3 i guanya tots els partits 6-0 6-0. Queda validat directament."}),
    el("div",{class:"field"},el("label",{for:"wo-qui",text:"Equip no presentat"}),qui),
    el("div",{class:"field"},el("label",{for:"wo-motiu",text:"Motiu"}),motiu),
    el("div",{class:"actions"},el("button",{class:"btn",type:"button",text:"Registrar el WO",onclick:async()=>{
      await guardar(()=>S.db.doc("validades/"+f.id).set({eliminatoria:f.id,divisio:f.divisio,tipus:"wo_equip",noPresentat:qui.value,motiu:motiu.value,validadaAt:new Date().toISOString(),validadaPer:S.uid}),"WO registrat. La classificació s'ha recalculat.");render()}}),
      el("button",{class:"btn sec",type:"button",text:"Cancel·lar",onclick:()=>panel.remove()}))));
  box.append(panel);
}
function confirmar(box,text,fn){
  const panel=el("div",{class:"card"},el("div",{class:"body"},el("p",{text}),el("div",{class:"actions"},
    el("button",{class:"btn danger",type:"button",text:"Sí, continuar",onclick:async()=>{await fn();render()}}),
    el("button",{class:"btn sec",type:"button",text:"Cancel·lar",onclick:()=>panel.remove()}))));
  box.append(panel);
}

/* ---------- render ---------- */
let ultimaVista=null;
function render(){
  if(S.lliga)$("#temporada").textContent="Temporada "+S.lliga.temporada;
  actualitzaFinestra();
  $("#adminBadge").hidden=!S.admin; $("#tabAvisos").hidden=!S.admin; $("#tabValidacio").hidden=!S.admin; $("#tabRols").hidden=!S.admin; $("#tabCapita").hidden=!(!S.admin&&S.db&&S.uid&&S.canWrite!==false);
  const me=S.admin?[]:meusEquips(); $("#rolBadge").hidden=!me.length; $("#rolBadge").textContent=me.length?`${me.every(t=>t.startsWith("F-"))?"Capitana":"Capità"} de ${me.map(nomEq).join(", ")}`:"";
  const np=pendents().length; $("#tabValidacio").textContent=np?`Validació (${np})`:"Validació";
  const v=view(); const clau=v+location.hash;
  if(clau!==ultimaVista){ if(ultimaVista!==null){S.flash=null;if(v!=="acta"||(S.draft&&("#acta-"+S.draft.eliminatoria)!==location.hash)){S.draft=null;S.editing=false}} ultimaVista=clau; }
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.view===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  // No refem el formulari mentre s'està omplint (es perdria el focus); només s'actualitza el resum
  if(S.editing&&S.draft&&v==="acta"&&$("#resum")){actualitzaResum();return}
  const box=$("#view"); box.replaceChildren(); S.editing=false;
  const msg=stateMsg(); if(msg){$("#divPicker").hidden=true;box.append(el("div",{class:"state",text:msg}));return}
  renderPicker();
  if(v==="calendari")renderCalendari(box); else if(v==="classificacio")renderClassificacio(box); else if(v==="equips")renderEquips(box);
  else if(v==="validacio")renderValidacio(box); else if(v==="avisos")renderAvisos(box); else if(v==="rols")renderRols(box); else if(v==="capita")renderCapita(box); else renderActaView(box);
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();

(async()=>{
  const timer=setTimeout(()=>{S.timeout=true;render()},10000);
  const [db,user,assets,sample]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets"),claude.use("sample")]);
  S.assets=assets; S.sample=sample; S.user=user;
  if(sample){try{const l=await sample.limits();S.imgOk=!!(l&&l.images)}catch(e){S.imgOk=false}}
  if(user){
    try{S.admin=!!(await user.canEdit())}catch(e){S.admin=false}
    try{const w=await user.can("data.write");S.canWrite=w==null?null:!!w}catch(e){S.canWrite=null}
    try{S.uid=await user.id()}catch(e){S.uid=null}
  }
  if(!db){clearTimeout(timer);S.noDb=true;render();return}
  S.db=db;
  const fail=e=>{clearTimeout(timer);S.error=e;render()};
  const done=()=>{if(Object.values(S.loaded).every(Boolean))clearTimeout(timer)};
  const col=(path,key,loadKey)=>db.collection(path).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S[key]=o;if(loadKey&&!q.metadata.fromCache)S.loaded[loadKey]=true;done();render()},loadKey?fail:()=>{});
  db.doc("lliga/config").onSnapshot(s=>{S.lliga=s.exists?s.data():null;if(!s.metadata.fromCache)S.loaded.lliga=true;done();render()},fail);
  col("equips","equips","equips");
  col("calendari","calendari","calendari");
  col("validades","validades","validades");
  col("sortejos","sortejos",null);
  db.doc("roles/capitans").onSnapshot(s=>{S.rols=s.exists?s.data():null;render()},()=>{});
  if(S.canWrite!==false)col("actes","actes",null);
  if(S.admin)col("solicituds","sol",null);
  else if(S.uid&&S.canWrite!==false)db.doc("solicituds/"+S.uid).onSnapshot(s=>{S.meva=s.exists?s.data():null;render()},()=>{});
  if(S.admin)db.doc("admin/avisos").onSnapshot(s=>{S.avisos=s.exists?s.data():null;render()},()=>{});
})();
</script>
